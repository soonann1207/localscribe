[project]
name = "localscribe"
version = "0.1.0"
description = "Local transcript auto-fill tool"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.0.0",
    "pyannote.audio>=4.0.0",  # diarize.py uses the 4.x API (token=, .speaker_diarization)
    "ollama>=0.3.0",
    "python-docx>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]
eval = ["jiwer>=3.0.0", "datasets>=2.19.0", "soundfile>=0.12.0", "pyannote.metrics>=3.2.0"]
server = ["fastapi>=0.115.0", "uvicorn[standard]>=0.30.0", "python-multipart>=0.0.9"]

[project.scripts]
localscribe-server = "tw.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tw"]
