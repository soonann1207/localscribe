[project]
name = "localscribe"
version = "0.1.0"
description = "Local transcript auto-fill tool"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.0.0",
    "pyannote.audio>=3.1.0",
    "ollama>=0.3.0",
    "python-docx>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
eval = ["jiwer>=3.0.0", "datasets>=2.19.0", "soundfile>=0.12.0", "pyannote.metrics>=3.2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tw"]
